        y: 2.0
        z: -5.0
      max_velocity:
        x: 5.0
        y: 8.0
        z: 5.0
      min_color:
        r: 1.0
        g: 1.0
        b: 1.0
      max_color:
        r: 1.0
        g: 0.8
        b: 0.2
      min_color_end:
