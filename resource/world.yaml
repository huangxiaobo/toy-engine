world:
  window:
    width: 1296
    height: 800
    gamma-correction: false
  clip:
    near: 0.1
    far: 1000.0
    fov: 45.0
    aspect: 1
  cameras:
    - name: "Main Camera"
      projection: perspective
      position:
        x: 80.0
        y: 60.0
        z: 80.0
      target:
        x: 0.0
        y: 0.0
        z: 0.0
      up:
        x: 0.0
        y: 1.0
        z: 0.0
    - name: "Top View"
      projection: orthographic
      position:
        x: 0.0
        y: 200.0
        z: 0.0
      target:
        x: 0.0
        y: 0.0
        z: 0.0
      up:
        x: 0.0
        y: 0.0
        z: -1.0
    - name: "Side View"
      projection: orthographic
      position:
        x: 200.0
        y: 0.0
        z: 0.0
      target:
        x: 0.0
        y: 0.0
        z: 0.0
      up:
        x: 0.0
        y: 1.0
        z: 0.0
  lights:
    - type: 0
      name: "sun"
      id: "a1000000-0000-0000-0000-000000000001"
      enabled: true
      direction:
        x: 0
        y: -10
        z: 0
      color:
        r: 0.3
        g: 0.3
        b: 0.3
      diffuse:
        color:
          r: 1.0
          g: 1.0
          b: 1.0
        intensity: 1.5
      ambient:
        color:
          r: 0.1
          g: 0.1
          b: 0.1
        intensity: 0.2
      specular:
        color:
          r: 1.0
          g: 1.0
          b: 1.0
        intensity: 1.0
    - type: 1
      name: "point_light_red"
      id: "b1000000-0000-0000-0000-000000000001"
      enabled: true
      position:
        x: 20.0
        y: 20.0
        z: 0.0
      color:
        r: 0.3
        g: 0.0
        b: 0.0
      diffuse:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 2.0
      ambient:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 0.08
      specular:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 0.5
      attenuation:
        constant: 1.0
        linear: 0.014
        exp: 0.0008
    - type: 1
      name: "point_light_blue"
      id: "b1000000-0000-0000-0000-000000000002"
      enabled: true
      position:
        x: 0.0
        y: 20.0
        z: 20.0
        w: 1.0
      color:
        r: 0.0
        g: 0.0
        b: 0.3
      diffuse:
        color:
          r: 0.0
          g: 0.5
          b: 1.0
        intensity: 2.0
      ambient:
        color:
          r: 0.0
          g: 0.5
          b: 1.0
        intensity: 0.08
      specular:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 0.5
      attenuation:
        constant: 1.0
        linear: 0.0
        exp: 0.0
    - type: 2
      name: "spot_light"
      id: "c1000000-0000-0000-0000-000000000001"
      enabled: true
      position:
        x: 0.0
        y: 30.0
        z: -5.0
      direction:
        x: 0.0
        y: -1.0
        z: 0.0
      color:
        r: 1.0
        g: 0.9
        b: 0.6
      diffuse:
        color:
          r: 1.0
          g: 0.9
          b: 0.6
        intensity: 3.0
      ambient:
        color:
          r: 1.0
          g: 0.9
          b: 0.6
        intensity: 0.08
      specular:
        color:
          r: 1.0
          g: 1.0
          b: 1.0
        intensity: 1.5
      attenuation:
        constant: 1.0
        linear: 0.0
        exp: 0.0
      cutoff: 12.5
      outer_cutoff: 25.0
  particles:
    - name: firework
      id: "9128d629-c651-4688-85ad-11bc3e6c2293"
      position:
          x: -15
          y: 20
          z: 15
      emit_rate: 150.0
      max_particles: 5000
      min_life: 3.5
      max_life: 7.5
      min_size: 8.0
      max_size: 15.0
      min_velocity:
        x: -5.0
        y: 2.0
        z: -5.0
      max_velocity:
        x: 5.0
        y: 8.0
        z: 5.0
      min_size_end: 0.0
      max_size_end: 0.5
      gravity:
        x: 0.0
        y: -10.0
        z: 0.0
      drag: 0.99
  sky_dome:
    radius: 200.0
    sectors: 32
    stacks: 16
    horizon_color:
      r: 0.6
      g: 0.7
      b: 0.9
    zenith_color:
      r: 0.1
      g: 0.2
      b: 0.5
    ground_color:
      r: 0.01
      g: 0.01
      b: 0.01
  terrain:
    plane-size: 100.0
    resolution: 128
    height-scale: 0.0
    noise-seed: 12345
  models:
    - resource_class: Model
      name: bunny
      id: "9128d629-c651-4688-85ad-11bc3e6c2293"
      position:
        x: 0
        y: 0
        z: 0
      scale:
        x: 15
        y: 15
        z: 15
      rotation: 0
      mesh:
        name: bunny
        file: "./resource/model/bunny/bunny_10k.obj"
      technique:
        technique:
          name: light
      shader:
        vert: "./resource/shader/toon.vert"
        frag: "./resource/shader/toon.frag"

      material:
        file: "./resource/model/bunny/bunny.mtl"
        name: "bunny_material"
    - resource_class: Model
      name: sphere
      id: "9128d629-c651-4688-85ad-11bc3e6c2294"
      position:
        x: 15
        y: 15
        z: -15
      scale:
        x: 1.0
        y: 1.0
        z: 1.0
      rotation: 0
      mesh:
        name: sphere
        file: "./resource/model/sphere/sphere.obj"
      technique:
        technique:
          name: light
      shader:
        vert: "./resource/shader/lit.vert"
        frag: "./resource/shader/lit.frag"
      material:
        file: "./resource/model/sphere/sphere.mtl"
        name: "sphere_material"
