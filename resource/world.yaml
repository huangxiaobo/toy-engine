world:
  window:
    width: 1296
    height: 800
    gamma-correction: false
  clip:
    near: 0.1
    far: 1000.0
    fov: 45.0
    aspect: 1
  cameras:
    - name: "Main Camera"
      position:
        x: 50.0
        y: 20.0
        z: 50.0
      target:
        x: 0.0
        y: 0.0
        z: 0.0
      up:
        x: 0.0
        y: 1.0
        z: 0.0
    - name: "Top View"
      position:
        x: 0.0
        y: 200.0
        z: 0.0
      target:
        x: 0.0
        y: 0.0
        z: 0.0
      up:
        x: 0.0
        y: 0.0
        z: -1.0
    - name: "Side View"
      position:
        x: 200.0
        y: 0.0
        z: 0.0
      target:
        x: 0.0
        y: 0.0
        z: 0.0
      up:
        x: 0.0
        y: 1.0
        z: 0.0
  lights:
    - type: 1
      position:
        x: 20.0
        y: 20.0
        z: 0.0
      color:
        r: 1.0
        g: 0.0
        b: 0.0
      diffuse:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 2.0
      ambient:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 1.0
      specular:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 1.0
      attenuation:
        constant: 1.0
        linear: 0.0
        exp: 0.0
    - type: 1
      position:
        x: -20.0
        y: 20.0
        z: 0.0
        w: 1.0
      color:
        r: 0.0
        g: 0.0
        b: 1.0
      diffuse:
        color:
          r: 0.0
          g: 0.5
          b: 1.0
        intensity: 2.0
      ambient:
        color:
          r: 0.0
          g: 0.5
          b: 1.0
        intensity: 1.0
      specular:
        color:
          r: 1.0
          g: 0.5
          b: 0.0
        intensity: 1.0
      attenuation:
        constant: 1.0
        linear: 0.0
        exp: 0.0
  particles:
    - name: firework
      id: "9128d629-c651-4688-85ad-11bc3e6c2293"
      position:
          x: 5
          y: 0
          z: -5
      emit_rate: 150.0
      max_particles: 5000
      min_life: 7.5
      max_life: 12.5
      min_size: 8.0
      max_size: 15.0
      min_velocity:
